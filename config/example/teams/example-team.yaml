name: Platform Team
description: Core platform engineers
privacy: closed
# Nest this team under another by naming it here. GitHub allows one parent, so
# at most one entry is accepted, and neither team may be `secret`. The child
# inherits the parent's repository access; the two member lists stay separate.
# Access is granted through teams — there is no key here for handing an
# individual direct access to a repository, by design. See
# `remove_excess_collaborators` in app.yaml for what happens to grants made
# that way in the GitHub UI.
parents: []
maintainers:
  - allanice001
repositories:
  # Simple permission string (backward compatible)
  infra: maintain
  
  # Template repository - can be reused by other repos
  template-go-api:
    permission: admin
    template: true
    topics:
      - backend
      - api
      - go-template
    codeowners:
      - allanice001
  
  # Advanced config with topics and pinning
  api:
    permission: push
    topics:
      - backend
      - api
      - project-platform
    codeowners:
      - allanice001
      - "@DragonSecurity/platform-team"
  
  # Repository using template (inherits permission and topics)
  my-api:
    from: template-go-api
    topics:
      - my-project
      # Will inherit: backend, api, go-template from template
  
  # Repository with pinning
  platform-index:
    permission: admin
    topics:
      - project-platform
      - documentation
    pinned: true
  
  # Simple read-only access
  web: pull
