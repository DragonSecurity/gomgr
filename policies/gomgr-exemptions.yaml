apiVersion: dragonguard/v1
kind: PolicyPack
metadata:
  name: gomgr-exemptions
  description: >-
    Findings this repository has looked at and accepted, with the reason
    written down next to them.

# An exemption is a decision, and it is reviewed like one. Each rule here is
# pinned to a single file and a single detector, because an exemption wide
# enough to catch the next finding is an exemption that hides it: dragonguard
# turns a match into status=accepted, which takes the finding out of the
# mandatory gates as well as out of the deny.

rules:
  - id: pem-parser-test-fixture
    description: The PEM literals in the gh client test are parser inputs, not a key.
    match:
      all:
        - finding.scanner == "gitleaks"
        - finding.rule_id == "private-key"
        - finding.file == "internal/gh/client_test.go"
    then:
      decision: allow
      exempt: true
      tags: [accepted, test-fixture]
      message: >-
        These are the inputs to maybeReadPEM's table of PEM-parsing tests. The
        bodies are twenty base64 characters of filler -- a well-formed PEM
        block wrapped around nothing, which is exactly what the test needs and
        what makes it not a credential. Note that a secret's fingerprint is
        computed over the redacted snippet, so it does not change with the key
        material: this exemption would swallow a real private key added to
        this one file. It stays scoped to this file for that reason, and this
        file must never hold a real key.

  - id: retry-jitter-not-cryptographic
    description: math/rand in the retry transport is backoff jitter, not key material.
    match:
      all:
        - finding.scanner == "opengrep"
        - finding.rule_id == "go.lang.security.audit.crypto.math_random.math-random-used"
        - finding.file == "internal/gh/retry.go"
    then:
      decision: allow
      exempt: true
      tags: [accepted, not-security-relevant]
      message: >-
        The single use is the jitter added to exponential backoff before a
        request to the GitHub API is retried. CWE-338 is about predictable
        randomness where unpredictability is the security property; nothing
        here is a secret, a token or an identifier, and the only consequence
        of a predictable value is that two clients retry in step. gosec
        already carries the same judgement inline as #nosec G404 at
        internal/gh/retry.go:89.
