version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: '1.26'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DragonSecurity/gomgr

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocyclo
    - misspell
    - unconvert
    - goconst
    - revive
    - gosec
  settings:
    gocyclo:
      min-complexity: 45
    goconst:
      min-len: 3
      min-occurrences: 3
      # Keys and field names, not values with meaning. These name a slot in a
      # Change's Details map, a GitHub API field or a YAML key, and they read
      # worse behind an identifier than as the literal they have to equal.
      #
      # The strings that are switched on — change scopes and actions,
      # repository visibilities, permission levels — are constants instead, so
      # a typo in one is a compile error rather than a change routed nowhere.
      ignore-string-values: '^(org|repo|name|path|content|message|branch|reconcile|permission|from|pinned|user|slug|description|privacy|template|topics|visibility|all|read|write|triage|maintain|admin|closed|secret|pull_request|required_status_checks|update|allow_[a-z_]+|delete_branch_on_merge|README\.md|\.github/renovate\.json)$'
    misspell:
      locale: US
    revive:
      confidence: 0.8
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
    gosec:
      # Keep this list in step with GOSEC_EXCLUDE in the Makefile. The
      # standalone gosec binary that `make security` runs does not read this
      # file, so a rule excluded in only one place is reported by the other.
      # G404 is deliberately absent: it is annotated at the one call site where
      # weak randomness is correct, so any other use is still caught.
      excludes:
        - G304 # Audit use of file path - we need this for config files
        - G301 # Directory permissions 0755 are fine for config dirs
        - G306 # File permissions 0644 are fine for config files
        - G101 # False positives on test PEM fixtures
        - G703 # Path traversal via taint analysis - config paths come from user
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
